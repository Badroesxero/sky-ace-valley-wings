<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sky Ace — Valley Wings</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="wrap">
  <h1>SKY ACE <span>— VALLEY WINGS</span></h1>
  <canvas id="game" width="960" height="600" aria-label="Sky Ace Valley Wings flight game"></canvas>
  <div id="bar">
    <div class="keys">
      <kbd>&uarr;</kbd> climb <kbd>&darr;</kbd> descend
      <kbd>&larr;</kbd><kbd>&rarr;</kbd> bank / turn
      <kbd>W</kbd> throttle + <kbd>S</kbd> throttle &minus;
      <kbd>P</kbd> pause <kbd>R</kbd> restart mission <kbd>M</kbd> mute <kbd>Enter</kbd> start
    </div>
    <div>
      <button id="startBtn" type="button">Start / Restart</button>
      <button id="pauseBtn" type="button">Pause</button>
    </div>
  </div>
  <p class="note">Runs fully offline in desktop Chrome. No network assets — terrain, aircraft,
  instruments and sound are all generated by the code in this folder.</p>
</div>
<script src="js/input.js"></script>
<script src="js/audio.js"></script>
<script src="js/terrain.js"></script>
<script src="js/aircraft.js"></script>
<script src="js/missions.js"></script>
<script src="js/instruments.js"></script>
<script src="js/render.js"></script>
<script src="js/shots.js"></script>
<script src="js/main.js"></script>
</body>
</html>
